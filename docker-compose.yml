# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kynde
      POSTGRES_PASSWORD: kynde_local
      POSTGRES_DB: kynde
    ports:
      - "5432:5432"
    volumes:
      - kynde-db:/var/lib/postgresql/data
volumes:
  kynde-db:
